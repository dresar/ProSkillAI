<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f18" />
      <stop offset="100%" stop-color="#0e1726" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)" />
  <rect width="1200" height="675" fill="url(#glow2)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="675" />
    <line x1="360" y1="0" x2="360" y2="675" />
    <line x1="640" y1="0" x2="640" y2="675" />
    <line x1="920" y1="0" x2="920" y2="675" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="535" x2="1200" y2="535" />
  </g>

  <g transform="translate(80, 70)">
    <rect width="112" height="28" rx="6" fill="#142e26" stroke="#065f46" stroke-width="1" />
    <text x="56" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">STEP 02</text>

    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">Test-Driven Development (TDD)</text>
    <text x="0" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Write failing tests first, confirm failure, make it pass, then refactor cleanly</text>
  </g>

  <g transform="translate(80, 220)">
    <g transform="translate(0, 0)">
      <rect width="320" height="260" rx="14" fill="#131722" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="40" cy="42" r="16" fill="#450a0a" />
      <text x="40" y="47" fill="#f87171" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">R</text>
      <text x="70" y="47" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">RED: Failing Test</text>
      <text x="24" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan x="24" dy="0">Write test defining desired behavior.</tspan>
        <tspan x="24" dy="22">Execute the test suite and confirm</tspan>
        <tspan x="24" dy="22">it fails for the exact expected reason.</tspan>
      </text>
      <rect x="24" y="180" width="272" height="52" rx="8" fill="#0b0f19" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" />
      <text x="36" y="211" fill="#f87171" font-family="monospace" font-size="12">FAIL: 1 failed, 0 passed</text>
    </g>

    <g transform="translate(360, 0)">
      <rect width="320" height="260" rx="14" fill="#131722" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="40" cy="42" r="16" fill="#064e3b" />
      <text x="40" y="47" fill="#34d399" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">G</text>
      <text x="70" y="47" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">GREEN: Passing Code</text>
      <text x="24" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan x="24" dy="0">Implement the minimal production</tspan>
        <tspan x="24" dy="22">code required to make the failing test</tspan>
        <tspan x="24" dy="22">pass cleanly without over-engineering.</tspan>
      </text>
      <rect x="24" y="180" width="272" height="52" rx="8" fill="#0b0f19" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="36" y="211" fill="#34d399" font-family="monospace" font-size="12">PASS: 55 passed, 0 failed</text>
    </g>

    <g transform="translate(720, 0)">
      <rect width="320" height="260" rx="14" fill="#131722" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="40" cy="42" r="16" fill="#0c4a6e" />
      <text x="40" y="47" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">F</text>
      <text x="70" y="47" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">REFACTOR &amp; VERIFY</text>
      <text x="24" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan x="24" dy="0">Clean up structure, enforce strict</tspan>
        <tspan x="24" dy="22">/nokomen rules, optimize runtime,</tspan>
        <tspan x="24" dy="22">and verify full test suite passes.</tspan>
      </text>
      <rect x="24" y="180" width="272" height="52" rx="8" fill="#0b0f19" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <text x="36" y="211" fill="#38bdf8" font-family="monospace" font-size="12">pnpm test &amp;&amp; pnpm build</text>
    </g>
  </g>

  <g transform="translate(80, 580)">
    <text x="0" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Skills Framework &#8226; Software Engineering Methodology &#8226; skills.biz.id</text>
  </g>
</svg>