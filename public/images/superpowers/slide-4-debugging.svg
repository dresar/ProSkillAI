<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#1c131a" />
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg4)" />
  <rect width="1200" height="675" fill="url(#glow4)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="675" />
    <line x1="360" y1="0" x2="360" y2="675" />
    <line x1="640" y1="0" x2="640" y2="675" />
    <line x1="920" y1="0" x2="920" y2="675" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="535" x2="1200" y2="535" />
  </g>

  <g transform="translate(80, 70)">
    <rect width="112" height="28" rx="6" fill="#3b200b" stroke="#78350f" stroke-width="1" />
    <text x="56" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">STEP 04</text>

    <text x="0" y="70" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5">Systematic Debugging</text>
    <text x="0" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">Hypothesis-driven scientific diagnosis: reproduce, isolate root cause, fix minimally</text>
  </g>

  <g transform="translate(80, 220)">
    <g transform="translate(0, 0)">
      <rect width="240" height="260" rx="14" fill="#131722" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="36" cy="36" r="14" fill="#1e293b" />
      <text x="36" y="41" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <text x="24" y="80" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Reproduce</text>
      <text x="24" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan x="24" dy="0">Construct exact</tspan>
        <tspan x="24" dy="22">reproduction test</tspan>
        <tspan x="24" dy="22">or curl command</tspan>
        <tspan x="24" dy="22">to trigger the bug.</tspan>
      </text>
      <rect x="20" y="195" width="200" height="42" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="28" y="221" fill="#f59e0b" font-family="monospace" font-size="11">test.reproduce()</text>
    </g>

    <g transform="translate(260, 0)">
      <rect width="240" height="260" rx="14" fill="#131722" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="36" cy="36" r="14" fill="#1e293b" />
      <text x="36" y="41" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <text x="24" y="80" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Hypothesize</text>
      <text x="24" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan x="24" dy="0">Form explicit</tspan>
        <tspan x="24" dy="22">hypotheses before</tspan>
        <tspan x="24" dy="22">inspecting logs</tspan>
        <tspan x="24" dy="22">and call stacks.</tspan>
      </text>
      <rect x="20" y="195" width="200" height="42" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="28" y="221" fill="#f59e0b" font-family="monospace" font-size="11">isolateTrace()</text>
    </g>

    <g transform="translate(520, 0)">
      <rect width="240" height="260" rx="14" fill="#131722" stroke="#1e293b" stroke-width="1.5" />
      <circle cx="36" cy="36" r="14" fill="#1e293b" />
      <text x="36" y="41" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">3</text>
      <text x="24" y="80" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Minimal Fix</text>
      <text x="24" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan x="24" dy="0">Apply surgically</tspan>
        <tspan x="24" dy="22">focused code edit</tspan>
        <tspan x="24" dy="22">without touching</tspan>
        <tspan x="24" dy="22">unrelated code.</tspan>
      </text>
      <rect x="20" y="195" width="200" height="42" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
      <text x="28" y="221" fill="#34d399" font-family="monospace" font-size="11">applyDiff(target)</text>
    </g>

    <g transform="translate(780, 0)">
      <rect width="260" height="260" rx="14" fill="#131722" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="36" cy="36" r="14" fill="#064e3b" />
      <text x="36" y="41" fill="#34d399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">&#10003;</text>
      <text x="24" y="80" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Regression Test</text>
      <text x="24" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
        <tspan x="24" dy="0">Commit regression</tspan>
        <tspan x="24" dy="22">test into repo so</tspan>
        <tspan x="24" dy="22">the same failure</tspan>
        <tspan x="24" dy="22">never recurs.</tspan>
      </text>
      <rect x="20" y="195" width="220" height="42" rx="6" fill="#0b0f19" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
      <text x="28" y="221" fill="#34d399" font-family="monospace" font-size="11">assert.equal(fixed)</text>
    </g>
  </g>

  <g transform="translate(80, 580)">
    <text x="0" y="22" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Skills Framework &#8226; Software Engineering Methodology &#8226; skills.biz.id</text>
  </g>
</svg>