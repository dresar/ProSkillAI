<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg_frameworks" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#0e131f" />
    </linearGradient>
    <radialGradient id="glow_frameworks" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg_frameworks)" />
  <rect width="800" height="450" fill="url(#glow_frameworks)" />

  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="450" />
    <line x1="240" y1="0" x2="240" y2="450" />
    <line x1="420" y1="0" x2="420" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="350" x2="800" y2="350" />
  </g>

  <g transform="translate(50, 45)">
    <rect width="120" height="26" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1" />
    <text x="60" y="17" fill="#3b82f6" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MCP MODULE</text>

    <text x="0" y="64" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">Agent Frameworks &amp; Orchestrators</text>
    <text x="0" y="90" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Agent loop, multi-agent coordination, and tool pipelines</text>
  </g>

  <g transform="translate(50, 165)">
    <rect width="700" height="175" rx="14" fill="#121622" stroke="#1e293b" stroke-width="1.5" />

    <g transform="translate(25, 25)">
      <rect width="190" height="125" rx="10" fill="#0b0e17" stroke="#1e293b" stroke-width="1" />
      <circle cx="24" cy="24" r="10" fill="#3b82f6" fill-opacity="0.2" />
      <text x="24" y="28" fill="#3b82f6" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">1</text>
      <text x="44" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Protocol Connect</text>
      <text x="16" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Standard JSON-RPC 2.0</text>
      <text x="16" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">stdio &amp; SSE transports</text>
      <rect x="16" y="94" width="158" height="20" rx="4" fill="#06080d" />
      <text x="24" y="108" fill="#3b82f6" font-family="monospace" font-size="10">initialize()</text>
    </g>

    <g transform="translate(255, 25)">
      <rect width="190" height="125" rx="10" fill="#0b0e17" stroke="#1e293b" stroke-width="1" />
      <circle cx="24" cy="24" r="10" fill="#3b82f6" fill-opacity="0.2" />
      <text x="24" y="28" fill="#3b82f6" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">2</text>
      <text x="44" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Tool Capabilities</text>
      <text x="16" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Typed tool schemas</text>
      <text x="16" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Sandboxed execution</text>
      <rect x="16" y="94" width="158" height="20" rx="4" fill="#06080d" />
      <text x="24" y="108" fill="#3b82f6" font-family="monospace" font-size="10">call_tool(args)</text>
    </g>

    <g transform="translate(485, 25)">
      <rect width="190" height="125" rx="10" fill="#0b0e17" stroke="#1e293b" stroke-width="1" />
      <circle cx="24" cy="24" r="10" fill="#3b82f6" fill-opacity="0.2" />
      <text x="24" y="28" fill="#3b82f6" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">3</text>
      <text x="44" y="28" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Agent Response</text>
      <text x="16" y="60" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Structured text &amp; images</text>
      <text x="16" y="78" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Context verification</text>
      <rect x="16" y="94" width="158" height="20" rx="4" fill="#06080d" />
      <text x="24" y="108" fill="#34d399" font-family="monospace" font-size="10">return content[]</text>
    </g>
  </g>

  <g transform="translate(50, 400)">
    <text x="0" y="18" fill="#64748b" font-family="monospace" font-size="11">Model Context Protocol 1.0 &#8226; skills.biz.id</text>
  </g>
</svg>