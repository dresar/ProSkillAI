<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="675" fill="#080c14"/>
    <rect x="40" y="40" width="1120" height="595" rx="12" fill="#050811" stroke="#1e293b" stroke-width="2"/>
    <text x="80" y="95" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399" letter-spacing="2">EXPOSED TOOL SCHEMAS · SPECIFICATION 02/05</text>
    <text x="80" y="135" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Registered Callable Tool Signatures</text>
    <rect x="80" y="180" width="500" height="180" rx="8" fill="#0d121f" stroke="#1e293b"/>
    <text x="105" y="215" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">1. invoke_chain(chain_id, input_payload)</text>
    <text x="105" y="245" font-family="sans-serif" font-size="12" fill="#94a3b8">Executes a pre-compiled LangChain or LangGraph runnable.</text>
    <text x="105" y="275" font-family="monospace" font-size="11" fill="#cbd5e1">Params: { chain_id: string, input: Record&lt;string, any&gt; }</text>
    <text x="105" y="305" font-family="monospace" font-size="11" fill="#10b981">Returns: { run_id: string, output: any, latency_ms: number }</text>

    <rect x="620" y="180" width="500" height="180" rx="8" fill="#0d121f" stroke="#1e293b"/>
    <text x="645" y="215" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">2. execute_agent_step(agent_id, action)</text>
    <text x="645" y="245" font-family="sans-serif" font-size="12" fill="#94a3b8">Steps forward autonomous agent trajectory with state verification.</text>
    <text x="645" y="275" font-family="monospace" font-size="11" fill="#cbd5e1">Params: { agent_id: string, action: AgentAction }</text>
    <text x="645" y="305" font-family="monospace" font-size="11" fill="#10b981">Returns: { state: 'continue' | 'done', observation: any }</text>

    <rect x="80" y="380" width="500" height="180" rx="8" fill="#0d121f" stroke="#1e293b"/>
    <text x="105" y="415" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">3. load_prompt_template(name, variables)</text>
    <text x="105" y="445" font-family="sans-serif" font-size="12" fill="#94a3b8">Hydrates parameterized system &amp; user prompt templates.</text>
    <text x="105" y="475" font-family="monospace" font-size="11" fill="#cbd5e1">Params: { name: string, variables: Record&lt;string, string&gt; }</text>
    <text x="105" y="505" font-family="monospace" font-size="11" fill="#10b981">Returns: { formatted_prompt: string, tokens: number }</text>

    <rect x="620" y="380" width="500" height="180" rx="8" fill="#0d121f" stroke="#1e293b"/>
    <text x="645" y="415" font-family="monospace" font-size="14" font-weight="bold" fill="#38bdf8">4. retrieve_runnable(filter_tags)</text>
    <text x="645" y="445" font-family="sans-serif" font-size="12" fill="#94a3b8">Discovers registered runnables by capability or category tag.</text>
    <text x="645" y="475" font-family="monospace" font-size="11" fill="#cbd5e1">Params: { tags: string[] }</text>
    <text x="645" y="505" font-family="monospace" font-size="11" fill="#10b981">Returns: { runnables: RunnableSummary[] }</text>
  </svg>